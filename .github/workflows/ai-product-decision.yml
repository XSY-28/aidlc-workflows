name: AIDA product approval

on:
  # Base-owned controls can inspect a fork's diff, but never execute its code.
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  issue_comment:
    types: [created]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request whose product assessment should be retried
        required: true
        type: number

permissions: {}

jobs:
  product:
    name: Assess product scope
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request_target' && !github.event.pull_request.draft)
    concurrency:
      group: aida-product-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: ai-pr-review
    timeout-minutes: 25
    permissions:
      contents: read
      checks: write
      pull-requests: read
      id-token: write
    env:
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      CODEX_VERSION: 0.151.0
      CLAUDE_CODE_VERSION: 2.1.267
      FABLE_MODEL: global.anthropic.claude-fable-5-1
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - name: Pin trusted controls and start the head check
        id: start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .aida-product-controls/scripts .aida-product-controls/prompts
          cp .github/scripts/ai-product-decision.ts .github/scripts/ai-pr-review.ts \
            .github/scripts/ai-pr-ledger.ts .github/scripts/prepare-ai-review-runtime.sh \
            .github/scripts/run-product-assessment.sh .aida-product-controls/scripts/
          cp .github/prompts/ai-product-decision* .aida-product-controls/prompts/
          bun .aida-product-controls/scripts/ai-product-decision.ts start \
            --repo "$REPO" --pr "$PR_NUMBER"
      - name: Build immutable product context
        if: steps.start.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun .aida-product-controls/scripts/ai-product-decision.ts context \
            --repo "$REPO" --pr "$PR_NUMBER"
      - name: Install pinned review runtimes
        if: steps.start.outputs.skip != 'true'
        run: >-
          npm install --global --silent
          "@openai/codex@$CODEX_VERSION"
          "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
      - name: Prepare read-only model runtime
        if: steps.start.outputs.skip != 'true'
        run: bash .aida-product-controls/scripts/prepare-ai-review-runtime.sh
      - name: Assume the review role
        if: steps.start.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@451ce2a72e8d729a59ebeaacab82dbce58e7af4c # v6
        with:
          role-to-assume: ${{ secrets.AWS_AI_PR_REVIEW_ROLE_ARN }}
          role-session-name: aidlc-product-${{ env.PR_NUMBER }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Identify product decisions
        if: steps.start.outputs.skip != 'true'
        run: bash .aida-product-controls/scripts/run-product-assessment.sh
      - name: Publish product result
        if: steps.start.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun .aida-product-controls/scripts/ai-product-decision.ts finish \
            --repo "$REPO" --pr "$PR_NUMBER" --input .ai-review-context/product-assessment.json
      - name: Leave an unfinished assessment actionable
        if: failure() && steps.start.outputs.check != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun .aida-product-controls/scripts/ai-product-decision.ts fail \
            --repo "$REPO" --pr "$PR_NUMBER"

  command:
    name: Apply product decision
    if: >-
      github.event_name == 'issue_comment'
      && github.event.issue.pull_request
      && github.event.comment.user.type != 'Bot'
      && startsWith(github.event.comment.body, '/aida product ')
    concurrency:
      group: aida-product-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - name: Verify the maintainer and record their product scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          ACTOR: ${{ github.event.comment.user.login }}
        run: |
          bun .github/scripts/ai-product-decision.ts command \
            --repo "$REPO" --pr "$PR_NUMBER" --comment "$COMMENT_ID" --actor "$ACTOR"

  queue:
    name: Verify queued product decisions
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - name: Verify every PR head in the group
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          bun .github/scripts/ai-product-decision.ts queue \
            --repo "$REPO" --base "$BASE" --head "$HEAD"
